[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-classifier"
version = "0.1.0"
description = "A resilient, async LLM ticket classifier package with observability, logging, cost reporting, and tracing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langfuse>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ticket_classifier*"]
